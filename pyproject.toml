[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "finance-analyzer"
version = "0.1.0"
description = "Financial analysis tool for recurring payments, balance forecasts, and savings recommendations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Finance Analyzer Team" }
]
dependencies = [
  "pandas>=2.2.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0"
]

[project.scripts]
finance-analyzer = "finance_analyzer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_analyzer"]
